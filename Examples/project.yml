# The example apps, as an Xcode project: four examples, each an iOS and a
# macOS app target (StackExample_iOS, StackExample_macOS, …), linking the
# package's products and ExampleData from the package at the repo root. Generate it with `xcodegen generate --spec
# Examples/project.yml` (the generated project is not committed).
name: AgentUIExamples
options:
  bundleIdPrefix: dev.agent-ui
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  AgentUI:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targetTemplates:
  # One target per platform (XcodeGen appends _iOS / _macOS), sharing the
  # sources and the package products.
  Example:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: ${target_name}
    dependencies:
      - package: AgentUI
        product: InboxUI
      - package: AgentUI
        product: MessagesUI
      - package: AgentUI
        product: NavigationUI
      - package: AgentUI
        product: ExampleData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agent-ui.${target_name}
        INFOPLIST_KEY_CFBundleDisplayName: ${target_name}
targets:
  StackExample:
    templates: [Example]
  SplitExample:
    templates: [Example]
  TabbedExample:
    templates: [Example]
  # The agent's page alone, on a fake agent.
  AgentExample:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: AgentExample
    dependencies:
      - package: AgentUI
        product: AgentUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agent-ui.AgentExample
        INFOPLIST_KEY_CFBundleDisplayName: AgentExample
