name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The proof, by hand: to propose a release, or to bisect.
  workflow_dispatch:
# A newer push to a pull request cancels its run before, if unfinished. A
# proof run is its own: it never waits on, or replaces, main's.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('proof-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Read only: no job here publishes or writes to the repository.
permissions:
  contents: read
# The jobs that only lease what they run in (changes, test, pins) run on OS
# Server's single-use runners (self-hosted, agent_ui-jit): each a fresh Linux
# container with `oss` on its PATH. The proof stays on the repository's own
# runner (self-hosted, agent_ui-ci), which builds its diff tool with Xcode's
# swiftc. No self-hosted runner ever runs a fork's pull request.
jobs:
  # Whether the pull request changes anything but documentation (Markdown,
  # docs/, .notes/); a push to main always does. A job it skips passes.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, agent_ui-jit]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The tests, in a macOS VM leased from OS Server (Tools/ci/mac_vm_tests.sh):
  # Xcode 27, the toolchain the code is written against, and the code held
  # to the Swift 6 mode with warnings as errors.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, agent_ui-jit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec Tools/ci/mac_vm_tests.sh

  # The proof, only when asked for by hand (workflow_dispatch), which is how
  # an agent proposes a release; pull requests and main's commits run their
  # tests alone. The demo apps' first screens, made in a macOS VM leased from
  # OS Server (Tools/ci/mac_vm_proof.sh), and how each differs from its
  # picture kept at the previous release (Tests/Proof at the newest v* tag
  # before the commit, else the commit before). Reviews reads the `proof`
  # artifact from GitHub by commit: no release without a proof of its
  # commit. To bisect, push a branch at an earlier commit and run the
  # workflow on it.
  proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, agent_ui-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and the tags: the previous release's kept pictures
          # are what the screens are compared with.
          fetch-depth: 0
          fetch-tags: true
      - name: The demo apps in a macOS VM, and the proof
        # exec: the runner's cancel reaches the script's trap, which releases the VM.
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2> /dev/null || git rev-parse HEAD^)"
          echo "Compared with $base"
          exec Tools/ci/mac_vm_proof.sh --kind full --base "$base" --proof "$RUNNER_TEMP/proof"
      # The proof whether the apps came up or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  # Ready to release: every dependency pinned to a released version. Run on
  # main's commits, which releases are of (a pull request may still pin a
  # revision); Reviews holds a release until it passes.
  pins:
    if: github.event_name == 'push'
    runs-on: [self-hosted, agent_ui-jit]
    steps:
      - uses: actions/checkout@v4
      - run: Tools/released_pins.sh
