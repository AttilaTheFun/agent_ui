name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The proof, by hand: to propose a release, or to bisect.
  workflow_dispatch:
# A newer push to a pull request cancels its run before, if unfinished.
# Every other run (a commit on main, a proof by hand) is a group of its own:
# GitHub keeps one pending run per group and cancels the rest, so main's
# runs sharing one left a commit queued between two others unchecked.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Read only: no job here publishes or writes to the repository.
permissions:
  contents: read
# What builds on Linux builds on OS Server's single-use runners
# (self-hosted, agent_ui-jit: each a fresh Linux container); what needs a
# Mac runs on GitHub's own (`xcode-27`), which a public repository has for
# free, leaving OS Server's machines to the agents (Logan, 5 Nov 2026). No
# self-hosted runner ever runs a fork's pull request.
jobs:
  # Whether the pull request changes anything but documentation (Markdown,
  # docs/, .notes/); a push to main always does. A job it skips passes.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, agent_ui-jit]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The rules of AGENTS.md that must hold, checked (Tools/check_rules.py):
  # no unchecked concurrency, no dependencies, and in Sources/ no Combine or
  # CoreGraphics, the Foundation other SwiftUIs' hosts lack only behind an
  # Apple platform's #if, one type per file. Only Python and git: on
  # GitHub's own runners, which a public repository has for free.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python3 Tools/check_rules.py

  # The tests, built on Linux as macOS bundles (Tools/ci/build_tests.sh:
  # Xcode 27.2's SDK, the code held to the Swift 6 mode with warnings as
  # errors), then run on one of GitHub's Macs (test).
  build-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, agent_ui-jit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: Tools/ci/build_tests.sh "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@v4
        with:
          name: test-bundles
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
          retention-days: 1

  # The bundles run in an xcode-27 runner's desktop session, where
  # AgentUIPackageTests' windows draw (Tools/ci/hosted_tests.sh). Named
  # `test` still: main's branch protection requires a check of that name,
  # which a pull request of documentation alone reports as skipped.
  test:
    needs: build-tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: test-bundles
          path: ${{ runner.temp }}/bundles
      - run: Tools/ci/hosted_tests.sh "$RUNNER_TEMP/bundles" --logs "$RUNNER_TEMP/test-logs"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
          retention-days: 7

  # The proof, only when asked for by hand (workflow_dispatch), which is how
  # an agent proposes a release; pull requests and main's commits run their
  # tests alone. The demo apps' first screens, made on one of GitHub's Macs
  # (Tools/ci/hosted_proof.sh), and how each differs from its
  # picture kept at the previous release (Tests/Proof at the newest v* tag
  # before the commit, else the commit before). Reviews reads the `proof`
  # artifact from GitHub by commit: no release without a proof of its
  # commit. To bisect, push a branch at an earlier commit and run the
  # workflow on it.
  proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The history and the tags: the previous release's kept pictures
          # are what the screens are compared with.
          fetch-depth: 0
          fetch-tags: true
      - name: The demo apps, built and pictured, and the proof
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2> /dev/null || git rev-parse HEAD^)"
          echo "Compared with $base"
          Tools/ci/hosted_proof.sh --kind full --base "$base" --proof "$RUNNER_TEMP/proof"
      # The proof whether the apps came up or not: a broken screen is what it's for.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  # Ready to release: every dependency pinned to a released version. Run on
  # main's commits, which releases are of (a pull request may still pin a
  # revision); Reviews holds a release until it passes.
  pins:
    if: github.event_name == 'push'
    runs-on: [self-hosted, agent_ui-jit]
    steps:
      - uses: actions/checkout@v4
      - run: Tools/released_pins.sh
